<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoVolt · Entrar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login">
<form id="f" class="caixa">
  <div class="logo">Eco<b>Volt</b></div>
  <p class="mut">Monitoramento de energia em salas e laboratórios</p>
  <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
  <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
  <p id="msg" class="erro" role="alert"></p>
  <button class="pri">Entrar</button>
</form>
<script>
  if (location.hostname.endsWith('netlify.app')) {
    window.ECOVOLT_API_URL = 'https://ecovolt-kxp9.onrender.com';
  }
</script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  if (Sessao.token()) location.replace('index.html');
  const form = document.getElementById('f'), msg = document.getElementById('msg');
  form.addEventListener('submit', async e => {
    e.preventDefault(); msg.textContent = '';
    const botao = form.querySelector('button'); botao.disabled = true;
    try {
      const d = await apiFetch('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: form.email.value.trim(), senha: form.senha.value })
      });
      Sessao.salvar(d.token, d.usuario);
      location.href = 'index.html';
    } catch (err) { msg.textContent = err.message; botao.disabled = false; }
  });
</script>
</body>
</html>
