<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste EcoVolt</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { color: #22c55e; }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
    }
    .potencia {
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
    }
    .info { color: #94a3b8; font-size: 14px; }
    #status { font-size: 13px; color: #64748b; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>⚡ EcoVolt — Teste de Conexão</h1>
  <div id="lista">Carregando...</div>
  <p id="status"></p>

  <script>
    async function carregarSalas() {
      const status = document.getElementById('status');
      try {
        const resposta = await fetch('http://localhost:3000/api/salas');
        if (!resposta.ok) throw new Error('Erro ' + resposta.status);
        const salas = await resposta.json();

        document.getElementById('lista').innerHTML = salas.map(sala => `
          <div class="card">
            <strong>${sala.nome}</strong> — ${sala.localizacao}<br>
            <span class="potencia">${sala.potencia_ativa_W ?? '--'} W</span><br>
            <span class="info">Última leitura: ${sala.timestamp ? new Date(sala.timestamp).toLocaleString('pt-BR') : 'sem leitura'}</span>
          </div>
        `).join('');

        status.textContent = 'Atualizado em: ' + new Date().toLocaleTimeString('pt-BR');
      } catch (erro) {
        document.getElementById('lista').innerHTML =
          '<div class="card">❌ Erro ao conectar com a API.<br>Confira se o <code>node server.js</code> está rodando.</div>';
        status.textContent = '';
        console.error(erro);
      }
    }

    carregarSalas();
    setInterval(carregarSalas, 10000); 
  </script>
</body>
</html>
